name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        env:
          PSYCOPG_PREFIX: ${{secrets.PSYCOPG_PREFIX}}
          SQLALCHEMY_PREFIX: ${{secrets.SQLALCHEMY_PREFIX}}
          ADMIN_USERNAME: ${{secrets.ADMIN_USERNAME}}
          ADMIN_PASSWORD: ${{secrets.ADMIN_PASSWORD}}
          READ_WRITE_USERNAME: ${{secrets.READ_WRITE_USERNAME}}
          READ_WRITE_PASSWORD: ${{secrets.READ_WRITE_PASSWORD}}
          READ_ONLY_USERNAME: ${{secrets.READ_ONLY_USERNAME}}
          READ_ONLY_PASSWORD: ${{secrets.READ_ONLY_PASSWORD}}
          TEST_POOLED_SUFFIX: ${{secrets.TEST_POOLED_SUFFIX}}
          TEST_UNPOOLED_SUFFIX: ${{secrets.TEST_UNPOOLED_SUFFIX}}
          PRODUCTION_POOLED_SUFFIX: "dummy_pooled_suffix"
          PRODUCTION_UNPOOLED_SUFFIX: "dummy_unpooled_suffix"
        run: uv run pytest
